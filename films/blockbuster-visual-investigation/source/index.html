<html lang="en"><head><meta charset="utf-8"><title>Blockbuster: The $50 Million Decision</title>

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Brand Coroner · Case 001 · "Blockbuster: The $50 Million Decision" — Visual Investigation style.
// One Canvas-2D page drawn deterministically by window.render(t). Timing (sections, voice, subtitles) lives in film.json.
const W = 1920, H = 1080;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const C = { bg:'#0B0C0E', panel:'#141619', line:'#2E3238', text:'#ECEAE4', dim:'#8B9097', faint:'#4A4F57', acc:'#FF4A2E', paper:'#E4E0D4', ink:'#1D1D1B' };
const F = { sans:'Sans', mono:'Mono', it:'SerifI' };
let FILM = null, SEC = {}, FR = 0, REC = null;

// ── utilities ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const inS = (t, k) => t >= SEC[k][0] && t < SEC[k][1];

// ── assets ──
const IM = {}; let GRAIN = [];
const PHOTOS = ['addison', 'anc1', 'anc2', 'anc5', 'glasgow', 'miami', 'card', 'disc', 'env', 'tower', 'dallas', 'bend', 'fairbanks'];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); SEC = FILM.sections; window.DUR = FILM.dur;
  const L = PHOTOS.map(k => load(`assets/${k}.jpg`).then(i => IM[k] = i));
  for (const f of ['700 40px Sans', '500 20px Sans', '400 20px Sans', '400 20px Mono', '600 20px Mono', 'italic 24px SerifI']) L.push(document.fonts.load(f));
  await Promise.all(L);
  for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 99 + 7);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  window.READY = true;
}

// ── drawing primitives ──
function txt(s, X, Y, o = {}) {
  x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  if (x.globalAlpha > 0.001) x.fillText(s, X, Y);
  const w = x.measureText(s).width; const ga = x.globalAlpha; x.restore();
  if (REC && o.id && ga > 0.5) { const sz = o.s || 24, x0 = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X;
    REC.push({ id: o.id, text: s, x0, y0: Y - sz * .9, x1: x0 + w, y1: Y + sz * .25 }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function rect(X, Y, w, h, c = C.line, lw = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function alpha(a, f) { if (a <= 0) return; x.save(); x.globalAlpha *= a; f(); x.restore(); }
function flashRect(t, at, X, Y, w, h, d = .12) { const k = 1 - seg(t, at, at + d); if (t < at || k <= 0) return; x.save(); x.globalAlpha = k; fill(X, Y, w, h, '#fff'); x.restore(); }
// red circle drawn clockwise; at 60 % a leader and a bold label
function ring(cx, cy, r, k, label, side = 1, id) {
  if (k <= 0) return; x.save(); x.strokeStyle = C.acc; x.lineWidth = 2.5;
  x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore();
  if (label && k > .6) { const a = seg(k, .6, .75); const lx = cx + side * (r * .72), ly = cy - r * .72, ex = lx + side * 40, ey = ly - 30;
    alpha(a, () => { hair(lx, ly, ex, ey, C.acc, 1.5); hair(ex, ey, ex + side * 14, ey, C.acc, 1.5); });
    const o = { s: 24, w: 700, al: side > 0 ? 'left' : 'right', a, id }, lw = tw(label, o) + 16, bx = side > 0 ? ex + side * 14 : ex + side * 14 - lw;
    alpha(a, () => fill(bx, ey - 20, lw, 34, 'rgba(11,12,14,0.78)'));
    txt(label, ex + side * 22, ey + 7, o); }
}
// a photo inside a panel: one grade, one grain, white flash on entry
function plate(img, sx, sy, sw, sh, X, Y, w, h, o = {}) {
  x.save(); x.globalAlpha *= (o.a ?? 1); fill(X, Y, w, h, '#000');
  if (img) { x.filter = o.doc ? 'grayscale(1) contrast(1.05) brightness(0.86)' : 'grayscale(1) contrast(1.22) brightness(0.94)'; x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.filter = 'none'; }
  if (GRAIN.length) { x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha *= o.doc ? .10 : .22;
    const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); }
  x.restore();
  if (o.flash > 0) { x.save(); x.globalAlpha = o.flash * (o.a ?? 1); fill(X, Y, w, h, '#fff'); x.restore(); }
  if (!o.noborder) rect(X, Y, w, h, o.border || C.line, o.bw || 1);
}
// fill a panel without stretching; fx/fy = focus (0–1); z = push (≤ 1.06 on photos); returns source-fraction → screen mapping
function photo(k, X, Y, w, h, o = {}) {
  const img = IM[k]; if (!img) { fill(X, Y, w, h, '#000'); return () => [X, Y]; }
  const crop = o.crop || [0, 0, 1, 1], iw = img.width * (crop[2] - crop[0]), ih = img.height * (crop[3] - crop[1]), ox = img.width * crop[0], oy = img.height * crop[1];
  let sw = iw, sh = iw * h / w; if (sh > ih) { sh = ih; sw = ih * w / h; }
  const z = o.z || 1; sw /= z; sh /= z;
  const fx = o.fx ?? .5, fy = o.fy ?? .5, sx = ox + clamp(fx * iw - sw / 2, 0, iw - sw), sy = oy + clamp(fy * ih - sh / 2, 0, ih - sh);
  plate(img, sx, sy, sw, sh, X, Y, w, h, o); const s = w / sw;
  return (u, v) => [X + (u * img.width - sx) * s, Y + (v * img.height - sy) * s];
}
function tag(s, X, Y, o = {}) { const w = txt(s, X + 14, Y, { s: o.s || 16, f: F.mono, c: o.c || C.text, w: 600, ls: 1, a: o.a ?? 1, id: o.id });
  alpha(o.a ?? 1, () => fill(X, Y - 11, 6, 12, o.chip || C.text)); return w; }
function badge(X, Y, t, at) { const k = seg(t, at, at + .06); if (k <= 0) return; x.save(); x.globalAlpha *= k; const s = 1 + .3 * (1 - seg(t, at, at + .18)); x.translate(X, Y); x.scale(s, s);
  x.fillStyle = 'rgba(11,12,14,0.85)'; x.fillRect(-15, -15, 30, 30); x.strokeStyle = C.acc; x.lineWidth = 2; x.strokeRect(-15, -15, 30, 30);
  x.beginPath(); x.moveTo(-8, 0); x.lineTo(-2, 7); x.lineTo(9, -7); x.lineWidth = 3; x.stroke(); x.restore(); }
function dashBox(X, Y, s = 24, c = C.acc) { x.save(); x.strokeStyle = c; x.lineWidth = 2; x.setLineDash([4, 3]); x.strokeRect(X, Y, s, s); x.restore(); }
function tick(X, Y, c = C.text) { x.save(); x.strokeStyle = c; x.lineWidth = 2.5; x.beginPath(); x.moveTo(X, Y); x.lineTo(X + 8, Y + 9); x.lineTo(X + 22, Y - 10); x.stroke(); x.restore(); }
function diamond(X, Y, r, c) { x.fillStyle = c; x.beginPath(); x.moveTo(X, Y - r); x.lineTo(X + r * .78, Y); x.lineTo(X, Y + r); x.lineTo(X - r * .78, Y); x.fill(); }

// Typeset filing excerpt (EDGAR text re-typeset; labelled as a transcription) on a paper card. lines: [text]; hl: [[line, from, to, at]] → red multiply wipe.
function doc(t, X, Y, w, lines, o = {}) {
  const s = o.s || 26, lh = o.lh || s * 1.5, pad = 30, h = o.h || (pad * 2 + 30 + lines.length * lh), at = o.at ?? -1;
  const k = seg(t, at, at + .04); if (k <= 0) return h;
  alpha(k, () => { fill(X, Y, w, h, C.paper); x.save(); x.globalAlpha *= .1; x.globalCompositeOperation = 'multiply'; x.drawImage(GRAIN[FR % 6], X, Y, Math.min(256, w), Math.min(256, h)); x.restore(); rect(X, Y, w, h, '#bdb8aa');
    if (o.head) { txt(o.head, X + pad, Y + pad + 12, { s: 16, f: F.mono, w: 600, c: '#6c685e', ls: 1 }); hair(X + pad, Y + pad + 26, X + w - pad, Y + pad + 26, '#bdb8aa'); }
    const top = Y + pad + (o.head ? 62 : 30), fo = { s, f: o.f || F.mono, w: o.wt || 400, it: o.it };
    const nTy = o.type ? Math.floor(seg(t, at, at + o.type) * lines.join('').length) : 1e9; let used = 0;
    lines.forEach((l, i) => { const vis = l.slice(0, clamp(nTy - used, 0, l.length)); used += l.length; txt(vis, X + pad, top + i * lh, { ...fo, c: C.ink });
      if (REC && vis.length === l.length) REC.push({ id: (o.id || 'doc') + i, text: l, x0: X + pad, y0: top + i * lh - s, x1: X + pad + tw(l, fo), y1: top + i * lh + 6 }); });
    (o.hl || []).forEach(([li, sub, ha]) => { const kk = eo(seg(t, ha, ha + .5)); if (kk <= 0) return; const l = lines[li], a = l.indexOf(sub), b = a + sub.length, x0 = X + pad + tw(l.slice(0, a), fo), x1 = X + pad + tw(l.slice(0, b), fo);
      x.save(); x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgba(255,74,46,0.6)'; x.fillRect(x0 - 3, top + li * lh - s * .92, (x1 - x0 + 6) * kk, s * 1.22); x.restore(); });
  });
  flashRect(t, at, X, Y, w, h, .12);
  if (o.tag) tag(o.tag, X, Y - 16, { id: (o.id || 'doc') + 'T', a: k });
  return h;
}
// quote card on a dark panel: red bar, source tag, italic original words
function quote(t, X, Y, w, lines, o = {}) { const at = o.at ?? -1, k = seg(t, at, at + .05); if (k <= 0) return; const s = o.s || 38, lh = s * 1.32, h = o.h || 70 + lines.length * lh;
  alpha(k, () => { if (o.panel !== false) { fill(X, Y, w, h, C.panel); rect(X, Y, w, h); } fill(X, Y, 6, h, o.bar || C.acc);
    lines.forEach((l, i) => txt(l, X + 34, Y + 34 + s + i * lh, { s, f: F.it, it: 1, c: o.c || C.text, id: (o.id || 'q') + i })); });
  flashRect(t, at, X, Y, w, h, .1); if (o.tag) tag(o.tag, X, Y - 16, { id: (o.id || 'q') + 'T', a: k }); }

// ── the clock: dates read in the picture ──
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const ym = (y, m = 1) => y + (m - 1) / 12;                       // decimal year
const fmtYM = v => { const y = Math.floor(v + 1e-6), m = Math.min(11, Math.floor((v - y) * 12 + 1e-6)); return `${MON[m]} ${y}`; };
function readout(s, X, Y, o = {}) { return txt(s, X, Y, { s: o.s || 56, f: F.mono, w: 600, c: o.c || C.acc, al: o.al, a: o.a, id: o.id }); }

// ── subtitles: one English line, bottom of frame ──
function subs(t) { for (const [a, b, en] of FILM.subs) if (t >= a && t < b) {
  x.save(); x.shadowColor = 'rgba(0,0,0,.95)'; x.shadowBlur = 10; txt(en, W / 2, 1004, { s: 34, w: 500, al: 'center' }); x.restore(); } }

// ═════════ sections (picture y 60–900, subtitles below) ═════════

// 0–4 cold open: the last frame of the story freezes first — the 2010 filing and a closing store — then the evidence slams in and the clock rewinds to 2000
function sOpen(t) {
  const G = [{ X: 60, Y: 60, w: 880, h: 400 }, { X: 980, Y: 60, w: 880, h: 400 }, { X: 60, Y: 500, w: 880, h: 390 }, { X: 980, Y: 500, w: 880, h: 390 }];
  const big = t < .7, rw = seg(t, 2.6, 4.0);
  const fr = big ? { X: 300, Y: 60, w: 1320, h: 830 } : G[0];
  const mp = photo('miami', fr.X, fr.Y, fr.w, fr.h, { crop: [0, 0, .9, .62], fx: .55, fy: .5, flash: big ? 1 - seg(t, 0, .13) : 1 - seg(t, .7, .8), a: 1 - rw });
  const [cx, cy] = mp(.66, .43); if (rw < 1) alpha(1 - rw, () => ring(cx, cy, big ? 170 : 95, big ? seg(t, .1, .5) : 1));
  readout('SEP 23, 2010', fr.X + fr.w - 18, fr.Y + 58, { s: big ? 44 : 26, al: 'right', a: seg(t, .2, .25) * (1 - rw) });
  if (!big) {
    if (t >= .7) alpha(1 - rw, () => doc(t, G[1].X, G[1].Y, G[1].w, ['On September 23, 2010, the Blockbuster', 'Inc. ... filed voluntary petitions', 'for relief under chapter 11'], { at: .7, s: 30, h: G[1].h, head: 'FORM 8-K · ITEM 1.03', hl: [[2, 'chapter 11', .9]] }));
    if (t >= 1.0) alpha(1 - rw, () => quote(t, G[2].X, G[2].Y, G[2].w, ['“$50 million”'], { at: 1.0, s: 64, h: G[2].h, tag: 'MEMOIR · RANDOLPH' }));
    if (t >= 1.3) alpha(1 - rw, () => photo('addison', G[3].X, G[3].Y, G[3].w, G[3].h, { fx: .55, fy: .5, flash: 1 - seg(t, 1.3, 1.44) }));
    const sw = seg(t, 1.7, 2.1); if (sw > 0 && sw < 1) { const sx = lerp(40, 1880, eo(sw)); hair(sx, 50, sx, 900, C.acc, 2.5); }
    if (t > 2.1 && t < 2.6) hair(40, 480, 1880, 480, C.acc, 1, [2, 6]);
  }
  if (rw > 0) { // rewind: the date runs back a decade under scan lines
    alpha(rw * .6, () => { for (let k = 0; k < 7; k++) { const yy = 60 + ((FR * 37 + k * 131) % 830); fill(60, yy, 1800, 2, '#fff'); } });
    const v = lerp(ym(2010, 9), ym(2000, 9), eio(rw)); readout(fmtYM(v), W / 2, 520, { s: 120, al: 'center', a: seg(rw, 0, .1) });
  }
}

// 4–10.5 title package: Dallas, where the story begins
function sTitle(t) { const l = t - SEC.title[0];
  photo('dallas', 60, 60, 1040, 780, { z: lerp(1, 1.06, seg(l, 0, 6.5)), fy: .5, flash: 1 - seg(l, 0, .12) });
  tag('PHOTO · DALLAS · 2009', 60, 46, { id: 'dTag' });
  const X0 = 1170, k = seg(l, .05, .1);
  txt('BRAND CORONER · CASE 001', X0, 250, { s: 22, w: 700, c: C.acc, ls: 4, a: k, id: 'kick' });
  txt('Blockbuster', X0, 380, { s: 104, w: 700, a: k, id: 'title1' });
  txt('The $50 Million Decision', X0, 460, { s: 50, w: 700, a: seg(l, .1, .15), id: 'title2' });
  hair(X0, 520, lerp(X0, 1860, eo(seg(l, .5, 1.0))), 520, C.line);
  const k4 = seg(l, .1, .2); x.save(); x.globalAlpha = k4; const lx = lerp(X0 - 40, X0, eo(seg(l, .2, .5)));
  fill(lx, 650, 6, 74, C.acc); txt('Dallas, Texas', lx + 24, 686, { s: 36, w: 700, id: 'lt1' }); txt('SEP 2000', lx + 26, 716, { s: 17, f: F.mono, c: C.dim, ls: 2, id: 'lt2' }); x.restore();
}

// 10.5–30 where and what is on record: one city, two sources place the meeting there; no transcript exists
function sPlace(t) {
  if (t < 20) { const l = t - 10.5;
    const tm = photo('tower', 60, 92, 620, 800, { z: lerp(1, 1.05, seg(l, 0, 9.5)), fx: .45, fy: .45, flash: 1 - seg(l, 0, .12) }); const [ta, tb] = tm(.47, .32); ring(ta, tb, 80, seg(t, 12.3, 12.8), '1201 Elm St', 1, 'elm');
    tag('PHOTO · RENAISSANCE TOWER · 2009', 60, 76, { id: 'twTag' });
    doc(t, 740, 92, 1120, ['Blockbuster Inc.', '1201 Elm Street, Dallas, Texas 75270'], { at: 11.4, s: 34, head: 'FORM 10-K · FISCAL 2004 · COVER', hl: [[1, '1201 Elm Street, Dallas, Texas 75270', 11.9]], tag: '10-K · TRANSCRIPTION', id: 'adr' });
    quote(t, 740, 420, 1120, ['three Netflix executives travel', 'to Dallas to meet Blockbuster'], { at: 13.7, s: 40, tag: 'MEMOIR · RANDOLPH 2019 · PARAPHRASE', id: 'mem' });
    const kl = eo(seg(t, 16.6, 17.4)); if (kl > 0) { hair(740, 200, lerp(740, 600, kl), lerp(200, 300, kl), C.acc, 1.4, [3, 4]); hair(740, 500, lerp(740, 600, kl), lerp(500, 330, kl), C.acc, 1.4, [3, 4]); }
    if (t > 17.4) { badge(1830, 120, t, 17.5); badge(1830, 448, t, 17.62); }
    alpha(seg(t, 18, 18.05), () => { readout('SEP 2000', 740, 760, { s: 72, id: 'sep' }); txt('one city, two sources', 744, 812, { s: 26, w: 500, c: C.dim, id: 'two' }); });
    return; }
  const l = t - 20; flashRect(t, 20, 0, 60, W, 840);
  txt('The meeting, on the record', 60, 150, { s: 56, w: 700, id: 'recH' });
  const cols = [{ x: 60, h: 'On record', c: C.text, items: [['Randolph’s memoir · 2019', 21.2], ['Antioco’s post · 2022', 21.5]] },
    { x: 980, h: 'Not on record', c: C.acc, items: [['A transcript', 22.4], ['Minutes of the meeting', 22.7], ['A signed offer', 23.0]] }];
  cols.forEach((c, ci) => { const k = seg(t, 20.4, 20.45); alpha(k, () => { txt(c.h, c.x, 300, { s: 36, w: 700, c: c.c, id: 'rh' + ci }); hair(c.x, 322, c.x + 880, 322, ci ? C.acc : C.text, 1.5); });
    c.items.forEach(([s, at], i) => { const ka = seg(t, at, at + .05); if (ka <= 0) return; const yy = 400 + i * 106;
      alpha(ka, () => { fill(c.x, yy - 40, 880, 86, i % 2 ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.04)'); if (ci) dashBox(c.x + 18, yy - 12); else tick(c.x + 20, yy); });
      txt(s, c.x + 64, yy + 12, { s: 32, w: 700, a: ka, id: `ri${ci}${i}` }); flashRect(t, at, c.x, yy - 40, 880, 86, .1); }); });
  alpha(seg(t, 26.3, 26.35), () => { fill(60, 780, 1800, 2, C.line); txt('two people in the room · two different memories', 60, 840, { s: 30, w: 500, c: C.dim, id: 'mem2' }); });
}

// 30–80 two accounts, one date: memoir (2019) and post (2022) both point back to Sept 2000 — and disagree
const AX = { y: 780, x0: 120, x1: 1800, y0: 2000, y1: 2022.5 }; const axX = v => lerp(AX.x0, AX.x1, (v - AX.y0) / (AX.y1 - AX.y0));
function accAxis(t, k) { alpha(k, () => { hair(AX.x0, AX.y, AX.x1, AX.y, C.line, 1.5);
  [2000, 2005, 2010, 2015, 2020].forEach(y => { hair(axX(y), AX.y, axX(y), AX.y + 8, C.dim); txt(String(y), axX(y), AX.y + 36, { s: 20, f: F.mono, c: C.dim, al: 'center' }); });
  diamond(axX(ym(2000, 9)), AX.y, 10, C.acc); txt('SEP 2000', axX(ym(2000, 9)) + 16, AX.y - 18, { s: 26, f: F.mono, w: 600, c: C.acc, id: 'axs' }); }); }
function sAccounts(t) {
  if (t < 63) {
    accAxis(t, seg(t, 30, 30.1));
