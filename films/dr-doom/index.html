<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url(fonts/Anton-Regular.ttf);font-display:block}
@font-face{font-family:'Barlow';src:url(fonts/BarlowCondensed-SemiBold.ttf);font-display:block}
@font-face{font-family:'Mono';src:url('fonts/JetBrainsMono[wght].ttf');font-weight:100 800;font-display:block}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, TAU } from '/core/lib.js';
import { EV, VO } from './timeline.js';

const W = innerWidth, H = innerHeight, K = W / 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const main = cv.getContext('2d');
let ctx = main;
const Y = '#FEC700', G = '#02462E', B = '#000000';
const FA = 'Anton', FB = 'Barlow', FM = 'Mono';
let BF = 0;

// ---------- layers (offscreen canvases for compositing inside one word) ----------
const POOL = [];
function layer(fn, alpha = 1, op = 'source-over') {
  let c = POOL.pop(); if (!c) { c = document.createElement('canvas'); c.width = W; c.height = H; }
  const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const keep = ctx; ctx = g; ctx.setTransform(keep.getTransform()); fn(); ctx = keep;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = op; ctx.drawImage(c, 0, 0); ctx.restore();
  POOL.push(c);
}

// ---------- type ----------
const CAP = {};
function capOf(f) { if (!CAP[f]) { const k = ctx.font; ctx.font = `100px ${f}`; const m = ctx.measureText('H'); CAP[f] = m.actualBoundingBoxAscent / 100; ctx.font = k; } return CAP[f]; }
function setFont(f, size, w = 400) { ctx.font = `${w || 400} ${size}px ${f}`; }
function widthOf(text, f, size, track = 0) { setFont(f, size); return ctx.measureText(text).width + track * (text.length - 1); }
// draws text centred on (x, y) = centre of cap height. o: f, col, sx, sy, rot, a, track, align, skx
function T(text, x, y, size, o = {}) {
  const f = o.f || FA; ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot);
  if (o.skx) ctx.transform(1, 0, o.skx, 1, 0, 0);
  ctx.scale(o.sx ?? 1, o.sy ?? 1);
  setFont(f, size, o.w || ''); ctx.fillStyle = o.col || Y; ctx.globalAlpha *= (o.a ?? 1);
  ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = (o.track || 0) + 'px';
  const w = ctx.measureText(text).width - (o.track || 0) * 0;
  const al = o.align || 'center';
  const dx = al === 'center' ? -w / 2 : al === 'right' ? -w : 0;
  ctx.textAlign = 'left';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.col || Y; ctx.strokeText(text, dx, capOf(f) * size / 2); }
  else ctx.fillText(text, dx, capOf(f) * size / 2);
  ctx.restore();
}
// per-letter layout centred on 0
function lay(text, f, size, track = 0) {
  setFont(f, size); ctx.letterSpacing = '0px';
  const ws = [...text].map(c => ctx.measureText(c).width); const tot = ws.reduce((a, b) => a + b, 0) + track * (text.length - 1);
  let x = -tot / 2; return [...text].map((c, i) => { const r = { c, x: x + ws[i] / 2, w: ws[i] }; x += ws[i] + track; return r; });
}
// misregistered print: green offset copy under the yellow
function P(text, x, y, size, o = {}) {
  const off = o.off ?? size * .025;
  T(text, x + off, y + off, size, { ...o, col: G, a: (o.a ?? 1) });
  T(text, x, y, size, o);
}

// ---------- texture: halftone, distress, hatching (palette-only) ----------
function dots(x0, y0, w, h, step, rmax, col, fnR) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let y = y0; y < y0 + h; y += step) for (let x = x0 + ((y - y0) / step % 2) * step / 2; x < x0 + w; x += step) {
    const r = rmax * fnR(x, y); if (r > .3) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  }
  ctx.fill();
}
function distress(x0, y0, w, h, seed, n = 180, col = B) {
  const R = mulberry(seed * 7919 + Math.floor(BF / 2)); ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < n; i++) { const x = x0 + R() * w, y = y0 + R() * h, r = .6 + R() * R() * 3.2; ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 0; i < n / 12; i++) { const x = x0 + R() * w, y = y0 + R() * h, l = 6 + R() * 30; ctx.moveTo(x, y); ctx.lineTo(x + l * .2, y + l); }
  ctx.stroke();
}
function hatch(x0, y0, w, h, gap, col, ang = .9, lw = 1.4) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  const d = w + h; for (let s = -d; s < d; s += gap) { ctx.moveTo(x0 + s, y0); ctx.lineTo(x0 + s + h * ang, y0 + h); } ctx.stroke(); ctx.restore();
}
// distressed hero word: yellow fill, ink speckle eaten into it (inside its own layer so speckle stays inside letters)
function hero(text, x, y, size, o = {}, seed = 1, speck = 1) {
  layer(() => {
    if (o.print !== false) T(text, x + size * .03, y + size * .03, size, { ...o, col: G });
    T(text, x, y, size, o);
    ctx.globalCompositeOperation = 'source-atop';
    const w = widthOf(text, o.f || FA, size, o.track || 0) * (o.sx ?? 1), h = size * capOf(o.f || FA) * (o.sy ?? 1);
    if (speck > 0) distress(x - w / 2 - 20, y - h / 2 - 20, w + 40, h + 40, seed, Math.floor(w * h / 900 * speck), B);
  }, o.a ?? 1);
}

// ---------- shards: split a word into jittered quads that fly apart ----------
function shardsOf(seed, cols = 7, rows = 3) {
  const R = mulberry(seed); const pts = [];
  for (let j = 0; j <= rows; j++) { pts.push([]); for (let i = 0; i <= cols; i++) { const ex = i === 0 || i === cols, ey = j === 0 || j === rows; pts[j].push([(i / cols - .5) + (ex ? 0 : (R() - .5) * .7 / cols), (j / rows - .5) + (ey ? 0 : (R() - .5) * .8 / rows)]); } }
  const out = []; for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const q = [pts[j][i], pts[j][i + 1], pts[j + 1][i + 1], pts[j + 1][i]];
    const cx = q.reduce((a, p) => a + p[0], 0) / 4, cy = q.reduce((a, p) => a + p[1], 0) / 4;
    out.push({ q, cx, cy, vx: cx * (1.2 + R()) + (R() - .5) * .4, vy: cy * (1.5 + R()) + (R() - .5) * .5, vr: (R() - .5) * 2.4, seed: R() });
  }
  return out;
}
const SH = {};
// draw `text` broken into shards. p = 0 intact → 1 fully dispersed. bw/bh = word box in px. grav adds fall.
function shatter(key, text, x, y, size, p, o = {}, spread = 1, grav = 0, cols = 7, rows = 3) {
  const sh = SH[key] || (SH[key] = shardsOf(key.length * 131 + key.charCodeAt(0), cols, rows));
  const bw = widthOf(text, o.f || FA, size, o.track || 0) * (o.sx ?? 1) * 1.08, bh = size * capOf(o.f || FA) * (o.sy ?? 1) * 1.3;
  for (const s of sh) {
    const e = eo(p);
    ctx.save();
    ctx.translate(x + s.vx * e * bw * spread + 0, y + s.vy * e * bh * spread * 2 + grav * p * p * 900 * (0.6 + s.seed));
    ctx.translate(s.cx * bw, s.cy * bh); ctx.rotate(s.vr * e * spread); ctx.translate(-s.cx * bw, -s.cy * bh);
    ctx.beginPath(); s.q.forEach(([u, v], i) => i ? ctx.lineTo(u * bw, v * bh) : ctx.moveTo(u * bw, v * bh)); ctx.closePath(); ctx.clip();
    T(text, 0, 0, size, o);
    if (o.edge) { ctx.strokeStyle = o.edge; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
  }
}
// crack network
function cracks(seed, x, y, w, h, p, col = B, lw = 3, n = 6) {
  const R = mulberry(seed); ctx.strokeStyle = col; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    let px = x + (R() - .5) * w * .5, py = y + (R() - .5) * h * .4, a = R() * TAU;
    const steps = 9; const len = Math.max(w, h) * .09;
    for (let k = 0; k < steps; k++) {
      const u = clamp(p * steps * 1.2 - k * .9 - i * .25, 0, 1); if (u <= 0) break;
      a += (R() - .5) * 1.1; const nx = px + Math.cos(a) * len * u, ny = py + Math.sin(a) * len * u;
      ctx.lineWidth = lw * (1 - k / steps * .7); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
      if (R() < .35 && u >= 1) { const b = a + (R() < .5 ? 1 : -1) * (.6 + R()); ctx.lineWidth = lw * .5; ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(nx + Math.cos(b) * len * .6, ny + Math.sin(b) * len * .6); ctx.stroke(); }
      px = nx; py = ny; if (u < 1) break;
    }
  }
}
function line(x0, y0, x1, y1, col, lw = 2, a = 1) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.globalAlpha = 1; }
function circle(x, y, r, col, lw = 2, a0 = 0, a1 = TAU, a = 1) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); ctx.globalAlpha = 1; }
function rectF(x, y, w, h, col, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1; }
function bg(col) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// text around a circle
function ringText(text, x, y, r, rot, size, col, f = FM, a = 1) {
  setFont(f, size); ctx.fillStyle = col; ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0px';
  const n = text.length;
  for (let i = 0; i < n; i++) { const ang = rot + i / n * TAU; ctx.save(); ctx.translate(x + Math.cos(ang) * r, y + Math.sin(ang) * r); ctx.rotate(ang + Math.PI / 2); ctx.fillText(text[i], 0, 0); ctx.restore(); }
  ctx.globalAlpha = 1;
}
// editorial sentence (Barlow) with a yellow rule; returns nothing. Placed in the safe area.
const SHOWN = [];
function say(id, text, x, y, size, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const al = o.align || 'center'; setFont(FB, size); ctx.letterSpacing = (o.track ?? 4) + 'px';
  const w = ctx.measureText(text).width;
  if (o.band) { ctx.fillStyle = B; ctx.fillRect((al === 'center' ? x - w / 2 : x) - 18, y - size * .62, w + 36, size * 1.24); }
  ctx.fillStyle = o.col || Y; ctx.textBaseline = 'middle'; ctx.textAlign = al; ctx.fillText(text, x, y + 2);
  ctx.restore();
  const x0 = al === 'center' ? x - w / 2 : x; SHOWN.push({ id, text, x0: x0 * K, y0: (y - size * .6) * K, x1: (x0 + w) * K, y1: (y + size * .6) * K });
}
function slug(n, title, a = 1) { // scene slug, diagrammatic, top-left
  ctx.save(); ctx.globalAlpha = a * .9; setFont(FM, 18, 500); ctx.letterSpacing = '3px'; ctx.fillStyle = Y; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(n, 196, 92); ctx.fillStyle = G; ctx.fillRect(196 + 44, 91, 40, 2); ctx.fillStyle = Y; ctx.globalAlpha = a * .65; ctx.fillText(title, 196 + 96, 92); ctx.restore();
}
const env = (t, a, b, fi = .3, fo = .3) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const shake = (t, t0, amp, dur = .35) => { const u = seg(t, t0, t0 + dur); if (u <= 0 || u >= 1) return [0, 0]; const k = (1 - u) * amp; return [(hash(t * 91.7) - .5) * k, (hash(t * 53.3 + 4) - .5) * k]; };

// =====================================================================================
// SCENE 01 · THE NAME BEFORE THE NAME · 0–6
function s1(t) {
  bg(B);
  const cx = 960, cy = 470;
  slug('01', 'THE NAME BEFORE THE NAME', env(t, .4, 6, .4, .4));
  // dot + pulse
  if (t < 1.1) {
    const r = 7 * back(seg(t, .3, .55)) * (1 + .9 * Math.sin(Math.PI * seg(t, .6, .9)));
    ctx.fillStyle = Y; ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, r), 0, TAU); ctx.fill();
    if (t > .6) circle(cx, cy, 10 + eo(seg(t, .6, 1.0)) * 120, Y, 2, 0, TAU, 1 - seg(t, .6, 1.0));
  }
  // V I C T O R arrive one by one from the dot, spread out, then lock together
  const size = 230, L = lay('VICTOR', FA, size, 6);
  const sw = 1 + 1.6 * eio(seg(t, 3.0, 4.6));     // swell past the frame
  const [kx, ky] = shake(t, 2.45, 16);
  ctx.save(); ctx.translate(cx + kx, cy + ky); ctx.scale(sw, sw);
  L.forEach((l, i) => {
    const ta = 1.0 + i * .2; if (t < ta) return;
    const spreadX = l.x * 1.9, lockX = l.x;
    const arrive = seg(t, ta, ta + .1), lockU = eio(seg(t, 2.2, 2.45));
    const from = [[0, -700], [0, 700], [-900, 0], [900, 0], [0, -700], [0, 700]][i];
    const x = lerp(spreadX + from[0] * (1 - arrive), lockX, lockU), y = from[1] * (1 - arrive);
    hero(l.c, x, y, size, {}, 10 + i, .5);
  });
  ctx.restore();
  // VON DOOM appears and fractures immediately
  if (t >= 3.6 && t < 5.3) {
    const p = seg(t, 4.3, 5.2);
    ctx.save(); ctx.globalAlpha = 1 - seg(t, 4.9, 5.25);
    shatter('vondoom', 'VON DOOM', cx, cy + 200, 100, p, { col: G, track: 10, edge: B }, 1.2, .4, 9, 2);
    ctx.restore();
  }
  say('s1', 'BEFORE THE WORLD FEARED HIS NAME.', 960, 820, 44, env(t, 2.4, 6.4, .4, .4), { band: true });
}

// SCENE 02 · BORN INTO DARKNESS · 6–14
const TOWER = [3.4, 5.2, 2.6, 6.4, 4.1, 2.9, 4.8, 3.3]; // vertical stretch of each LATVERIA letter
function s2(t) {
  bg(B);
  slug('02', 'BORN INTO DARKNESS', env(t, 6.2, 14, .4, .3));
  const cx = 960, base = 800;
  const L = lay('LATVERIA', FA, 300, 4);
  const rise = eio(seg(t, 7.0, 8.3));
  const dim = 1 - .6 * seg(t, 8.8, 9.3);
  const tear = eio(seg(t, 11.55, 12.2));
  // the composition is torn by LOSS: left half moves left, right half right
  const drawWorld = () => {
    L.forEach((l, i) => {
      const lt = 6.0 + i * .06; if (t < lt) return;
      const sy = lerp(1, TOWER[i] * .55, eio(seg(t, 7.0 + i * .1, 7.9 + i * .1)));
      const nx = lerp(l.x, l.x * .62, rise);
      const capH = 300 * capOf(FA);
      const yc = lerp(500, base - capH * sy / 2, rise);
      const sl = lerp(.6, 1, eo(seg(t, lt, lt + .25)));
      layer(() => {
        T(l.c, cx + nx, yc, 300, { col: G, sy: sy * sl, sx: sl });
        ctx.globalCompositeOperation = 'source-atop';
        hatch(cx + nx - l.w / 2 - 10, yc - capH * sy / 2 - 10, l.w + 20, capH * sy + 20, 9, B, .2, 1.2);
        // windows
        if (t > 8.0) { const R = mulberry(i * 17 + 3); for (let k = 0; k < 7; k++) { const wx = cx + nx + (R() - .5) * l.w * .7, wy = yc + (R() - .5) * capH * sy * .9; const on = hash(i * 13 + k * 7 + Math.floor(t * 3 + R() * 5)) > .35; if (on) rectF(wx, wy, 7, 14, Y); } }
      }, dim);
    });
    // ground line
    if (rise > 0) line(cx - 900 * rise, base + 2, cx + 900 * rise, base + 2, G, 3);
  };
  if (tear <= 0) drawWorld();
  else {
    const gap = 300 * tear;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.beginPath();
      const R = mulberry(77); const edge = []; for (let y = -50; y <= 1130; y += 40) edge.push([960 + (R() - .5) * 40, y]);
      if (side < 0) { ctx.moveTo(-100, -50); edge.forEach(p => ctx.lineTo(p[0], p[1])); ctx.lineTo(-100, 1130); }
      else { ctx.moveTo(2100, -50); edge.forEach(p => ctx.lineTo(p[0], p[1])); ctx.lineTo(2100, 1130); }
      ctx.closePath(); ctx.translate(side * gap / 2, 0); ctx.clip();
      drawWorld(); drawWords(t, true);
      ctx.restore();
    }
    // torn emerald fibres along the gap
    const R = mulberry(5); ctx.fillStyle = G;
    for (let y = 0; y < 1080; y += 26) { const w = 6 + R() * 16; ctx.fillRect(960 - gap / 2 - w + (R() - .5) * 20, y, w, 18 + R() * 20); ctx.fillRect(960 + gap / 2 + (R() - .5) * 20, y + 10, w, 14 + R() * 20); }
  }
  if (tear <= 0) drawWords(t, false);
  // LOSS itself sits in the gap, vertical
  if (t >= 11.4) {
    const a = seg(t, 11.4, 11.5);
    hero('LOSS', 960, 470, 250, { rot: -Math.PI / 2, a, sx: lerp(1.4, 1, eo(seg(t, 11.4, 11.6))) }, 31, .4);
  }
  // small VICTOR, dwarfed
  if (t >= 12.4) T('VICTOR', 960, 815, 34, { f: FA, track: 6, a: seg(t, 12.4, 12.6) });
  say('s2a', 'A CHILD OF LATVERIA.', 960, 140, 46, env(t, 7.6, 10.6, .3, .3));
  say('s2b', 'A LIFE DEFINED BY LOSS.', 960, 140, 46, env(t, 11.6, 14.2, .3, .3));
}
function drawWords(t, torn) {
  // FATHER — eaten by black ink, dripping
  if (t >= 9.0 && t < 10.3) {
    const p = seg(t, 9.35, 10.15);
    layer(() => {
      hero('FATHER', 960, 470, 230, { a: 1 }, 21, .4);
      ctx.globalCompositeOperation = 'destination-out';
      const R = mulberry(9); ctx.fillStyle = '#000'; ctx.beginPath();
      for (let i = 0; i < 260; i++) { const x = 640 + R() * 640, y = 360 + R() * 220, h0 = R(); const r = Math.max(0, (p * 1.5 - h0 * .9)) * (18 + R() * 40); if (r > 0) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); } }
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    });
    // drips of black ink falling out of the word (black over black reads as gaps; show them as emerald trails)
    const R = mulberry(19); for (let i = 0; i < 14; i++) { const x = 680 + R() * 560, y0 = 560, l = eo(p) * (60 + R() * 220); line(x, y0, x, y0 + l, G, 3 + R() * 5, 1 - seg(t, 10.0, 10.3)); }
  }
  // MOTHER — sealed in a yellow occult circle
  if (t >= 10.2 && t < 11.6 || (torn && t >= 10.2)) {
    const a = torn ? 1 - seg(t, 12.0, 12.6) : 1;
    const draw = seg(t, 10.3, 11.3);
    ctx.save(); ctx.globalAlpha = a * (1 - .65 * seg(t, 11.4, 11.6));
    hero('MOTHER', 960, 470, 170, {}, 23, .3);
    const r = 300; circle(960, 470, r, Y, 3, -Math.PI / 2, -Math.PI / 2 + TAU * eio(draw));
    circle(960, 470, r - 26, Y, 1.4, Math.PI / 2, Math.PI / 2 + TAU * eio(seg(t, 10.45, 11.4)));
    if (draw > .3) ringText('· LIFE · DEATH · RETURN · VEIL · BEYOND · NAME · BLOOD · STAR ', 960, 470, r - 13, t * .3, 14, Y, FM, seg(t, 10.5, 10.9));
    const star = 7; ctx.strokeStyle = Y; ctx.lineWidth = 1.6; ctx.beginPath();
    const sp = eio(seg(t, 10.6, 11.4));
    for (let i = 0; i <= star * sp; i++) { const k = (i * 3) % star; const ang = -Math.PI / 2 + k / star * TAU; const px = 960 + Math.cos(ang) * (r - 40), py = 470 + Math.sin(ang) * (r - 40); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();
    ctx.restore();
  }
}

// SCENE 03 · A MIND WITHOUT LIMITS · 14–23
const FRAG = (() => {
  const R = mulberry(314), bits = ['∂ψ/∂t', 'E=mc²', '∇×B', 'Σ', 'λ', '∞', 'Δx·Δp≥ħ/2', 'f(x)', '01101', '3.14159', 'θ', 'Ω', 'iℏ', 'r=a(1−e²)', '∫', '√2', 'π', 'α', 'κ', '1/c²', 'ℓ', 'μ₀', 'Ψ', '≡', '⊗', 'n→∞', 'ε', 'ω₀', '2π', 'φ'];
  const out = []; for (let i = 0; i < 220; i++) out.push({ s: bits[i % bits.length], u: R() - .5, v: R() - .5, ring: Math.floor(R() * 5), ph: R() * TAU, size: 14 + R() * 22, sp: .2 + R() * .5 });
  return out;
})();
function s3(t) {
  bg(B);
  slug('03', 'A MIND WITHOUT LIMITS', env(t, 14.1, 23, .3, .3));
  const cx = 960, cy = 480;
  // GENIUS → detonation
  if (t < 15.0) {
    const s = lerp(.8, 1.06, eo(seg(t, 14.0, 14.3))) + .03 * seg(t, 14.3, 15.0);
    hero('GENIUS', cx, cy, 300, { sx: s, sy: s }, 41, .5);
  }
  // fragments: start inside GENIUS box, fly to orbits around a black void, keep orbiting
  if (t >= 15.0) {
    const e = eo(seg(t, 15.0, 15.9));
    const fade = 1 - seg(t, 17.2, 17.9);
    // black void with emerald rim
