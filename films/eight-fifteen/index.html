<body><canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, ei, back, mulberry, hash, vnoise, TAU } from '/core/lib.js';
import { T, LINES, SUBS } from './timeline.js';

const W = innerWidth, H = innerHeight;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
let ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');
function drawTo(c2, fn) { const keep = ctx; ctx = c2; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H); fn(); ctx = keep; }
const SX = W / 1920;

// ---------------- palette ----------------
const P = {
  ink: '#2e211d', paper: '#f2ece1',
  wall: '#9bb8b9', wallSh: '#88a6a8', post: '#6f5146', postSh: '#5b4139',
  sand: '#d8a77f', sandSh: '#c08d69', table: '#e9dcc2', tableEdge: '#d7c4a2', apron: '#5a3f37',
  red: '#b8434a', redSh: '#963239', wine: '#3a1f22', mauve: '#8c5c66', cream: '#f6efe6',
  frame: '#7b5a5c', frameSh: '#664a4c', glaze: '#7f8f94', glazeSh: '#6b7a80', bowl: '#8e8984', bowlSh: '#76716c',
  peach: '#c9525a', peachSh: '#a8414a', brass: '#c9a46a', brassSh: '#a8854f', dial: '#f3ead8',
  sky0: '#cfe0de', sky1: '#efe2c9', hill0: '#a9bab5', hill1: '#8fa79b', earth: '#cdb994',
  river: '#8fb2b5', riverHi: '#b5cfcf', roof: '#5d6670', roof2: '#7a5e60', houseW: '#e6d5b8', houseWood: '#a07d62',
  tree: '#7f9a6a', treeSh: '#677f55', copper: '#6e9c8a', tramG: '#6f8f6a',
  ash: '#b9b2a6', ashSky0: '#9d8f7c', ashSky1: '#c9bca5', ashEarth: '#a99d88', rubble: '#8f8375', rubbleSh: '#776c60', char: '#4a403a', smoke: '#8a7d6c',
};

// ---------------- global drawing state ----------------
let BF = 0;          // boil frame (12 fps)
let DR = 0;          // drain: 0 = colour, 1 = only lines on paper
let CS = 1;          // current camera scale (to keep line width constant on screen)
let JA = 0.9;        // jitter amplitude in screen px

function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const C = c => DR <= 0 ? c : mix(c, P.paper, DR);
function J(x, y) {
  const a = JA / CS;
  return [x + (hash(x * .0131 + y * .0297 + BF * 7.13) - .5) * 2 * a, y + (hash(y * .0173 - x * .0271 + BF * 3.37 + 9) - .5) * 2 * a];
}
function path(pts, closed = true, smooth = false) {
  ctx.beginPath();
  const q = pts.map(p => J(p[0], p[1]));
  if (!smooth) { q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (closed) ctx.closePath(); return; }
  const n = q.length;
  if (closed) {
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let s = m(q[n - 1], q[0]); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const e = m(q[i], q[(i + 1) % n]); ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++) { const e = [(q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2]; ctx.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
    ctx.lineTo(q[n - 1][0], q[n - 1][1]);
  }
}
function ink(lw = 2.4, col = P.ink, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.lineWidth = lw / CS; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); ctx.globalAlpha = 1;
}
function fillc(col, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = C(col); ctx.fill(); ctx.globalAlpha = 1; }
function shape(pts, col, o = {}) {
  path(pts, true, o.smooth);
  if (col) fillc(col, o.a ?? 1);
  if (o.lw !== 0) ink(o.lw ?? 2.4, o.line ?? P.ink, o.la ?? 1);
}
function line(pts, lw = 2.4, smooth = false, col = P.ink, a = 1) { path(pts, false, smooth); ink(lw, col, a); }
function ell(cx, cy, rx, ry, n = 28, rot = 0) {
  const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; p.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return p;
}
function rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function clipTo(pts, fn, smooth = false) { ctx.save(); path(pts, true, smooth); ctx.clip(); fn(); ctx.restore(); }
function softEll(cx, cy, rx, ry, col, a) { // soft shadow, no line
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); const [r, gg, b] = hex(col);
  g.addColorStop(0, `rgba(${r},${gg},${b},${a * (1 - DR)})`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function cam(cx, cy, s) { CS = s * SX; ctx.setTransform(CS, 0, 0, CS, W / 2 - cx * CS, H / 2 - cy * CS); }

// ---------------- textures (deterministic) ----------------
function noiseCanvas(w, h, seed, scale, oct = 3) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const im = g.createImageData(w, h); const R = mulberry(seed);
  const grid = []; const G = 64; for (let i = 0; i < G * G; i++) grid.push(R());
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const at = (i, j) => grid[((j % G + G) % G) * G + ((i % G + G) % G)];
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = 0, a = 1, f = 1 / scale, tot = 0; for (let o = 0; o < oct; o++) { v += vn(x * f, y * f) * a; tot += a; a *= .5; f *= 2.1; } v /= tot;
    const i = (y * w + x) * 4; const k = Math.round(v * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = k; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0); return c;
}
const TEX = noiseCanvas(480, 270, 7, 22, 4);      // mottled paint
const FINE = noiseCanvas(480, 270, 19, 2.2, 2);   // paper tooth
function mottle(x, y, w, h, a = .16) {
  if (DR >= 1) return; ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = a * (1 - DR);
  ctx.drawImage(TEX, x, y, w, h); ctx.restore();
}

// ---------------- props ----------------
function vase(cx, base, k = 1) {
  const prof = [[34, -420], [26, -400], [24, -372], [62, -322], [108, -255], [128, -170], [120, -85], [92, -25], [72, -5], [70, 0]];
  const pts = prof.map(([x, y]) => [cx + x * k, base + y * k]).concat(prof.slice().reverse().map(([x, y]) => [cx - x * k, base + y * k]));
  path(pts, true, true); fillc(P.sand);
  clipTo(pts, () => { // shade right side
    const sh = prof.map(([x, y]) => [cx + x * k * .35 + 30 * k, base + y * k]).concat([[cx + 200 * k, base], [cx + 200 * k, base - 430 * k]]);
    path(sh, true, true); fillc(P.sandSh, .9);
    mottle(cx - 140 * k, base - 430 * k, 280 * k, 440 * k, .25);
  }, true);
  path(pts, true, true); ink(2.6);
  shape(ell(cx, base - 420 * k, 34 * k, 7 * k), '#9c6e52', { lw: 2 });
  shape(ell(cx + 70 * k, base - 230 * k, 7 * k, 5 * k), '#efcfb0', { lw: 0 });
  line([[cx + 60 * k, base - 265 * k], [cx + 64 * k, base - 258 * k]], 1.6);
}
function teacup(cx, base) {
  const w0 = 50, w1 = 40, h = 112;
  const pts = [[cx - w0, base - h], [cx + w0, base - h], [cx + w1, base], [cx - w1, base]];
  shape(pts, P.glaze, { lw: 0 });
  clipTo(pts, () => { shape([[cx + 12, base - h], [cx + 60, base - h], [cx + 50, base], [cx + 8, base]], P.glazeSh, { lw: 0 }); shape(rect(cx - 60, base - h, 120, 22), '#d9cfbf', { lw: 0 }); mottle(cx - 60, base - h, 120, h, .3); });
  shape(pts, null, { lw: 2.4 });
  shape(ell(cx, base - h, w0, 10), '#6b5a3a', { lw: 2.2 });
  shape(ell(cx, base - h + 2, w0 - 8, 6), '#8b7a4a', { lw: 0 });
}
function bowl(cx, rim, fruit, fruitCol = P.peach, fruitSh = P.peachSh) {
  // fruit behind rim
  for (const [dx, dy, r] of fruit) {
    const p = ell(cx + dx, rim + dy, r, r * 1.02, 30);
    shape(p, fruitCol, { lw: 0 }); clipTo(p, () => shape(ell(cx + dx + r * .45, rim + dy + r * .2, r * .9, r, 24), fruitSh, { lw: 0 }));
    shape(p, null, { lw: 2.4 });
    line([[cx + dx - 2, rim + dy - r * .95], [cx + dx + 4, rim + dy - r * 1.25]], 3);
    shape(ell(cx + dx - r * .35, rim + dy - r * .4, r * .16, r * .1, 14, -.6), '#f2b9b0', { lw: 0, a: .9 });
  }
  const b = [[cx - 160, rim], [cx + 160, rim], [cx + 130, rim + 52], [cx + 70, rim + 70], [cx - 70, rim + 70], [cx - 130, rim + 52]];
  shape(b, P.bowl, { lw: 0, smooth: true });
  clipTo(b, () => shape([[cx + 40, rim], [cx + 200, rim], [cx + 200, rim + 80], [cx + 20, rim + 80]], P.bowlSh, { lw: 0 }), true);
  shape(b, null, { smooth: true });
  shape(ell(cx, rim, 160, 9), '#a29d97', { lw: 2.2 });
}
function watchFace(cx, cy, R, secs, cracked, opts = {}) {
  const hh = secs / 3600 % 12, mm = secs / 60 % 60, s = Math.floor(secs % 60);
  // bow + crown
  shape(ell(cx, cy - R - R * .2, R * .17, R * .13), null, { lw: R > 200 ? 9 : 3.2, line: C(P.brassSh) });
  shape(rect(cx - R * .08, cy - R - R * .12, R * .16, R * .14), P.brass, { lw: R > 200 ? 3 : 2 });
  const c0 = ell(cx, cy, R, R, 48);
  shape(c0, P.brass, { lw: R > 200 ? 3.2 : 2.4 });
  clipTo(c0, () => shape(ell(cx + R * .25, cy + R * .2, R, R, 40), P.brassSh, { lw: 0 }));
  const d = ell(cx, cy, R * .86, R * .86, 48);
  shape(d, P.dial, { lw: R > 200 ? 2.8 : 2 });
  if (R > 200) mottle(cx - R, cy - R, R * 2, R * 2, .12);
  // ticks
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU, r0 = R * (i % 5 ? .8 : .76), r1 = R * .84;
    line([[cx + Math.sin(a) * r0, cy - Math.cos(a) * r0], [cx + Math.sin(a) * r1, cy - Math.cos(a) * r1]], R > 200 ? (i % 5 ? 2 : 4) : (i % 5 ? .8 : 1.6));
  }
  if (R > 120) {
    ctx.fillStyle = P.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `500 ${Math.round(R * .17)}px Mincho`;
    for (let i = 1; i <= 12; i++) { const a = i / 12 * TAU; ctx.fillText(String(i), cx + Math.sin(a) * R * .63, cy - Math.cos(a) * R * .63 + R * .01); }
  }
  const hand = (a, len, w, col) => {
    const sx = Math.sin(a), cy_ = -Math.cos(a), nx = -cy_, ny = sx;
    shape([[cx - sx * len * .14 + nx * w, cy - cy_ * len * .14 + ny * w], [cx + sx * len, cy + cy_ * len], [cx - sx * len * .14 - nx * w, cy - cy_ * len * .14 - ny * w]], col, { lw: R > 200 ? 2.2 : 1.2 });
  };
  hand(hh / 12 * TAU, R * .45, R * .045, P.ink);
  hand(mm / 60 * TAU, R * .68, R * .035, P.ink);
  const sa = s / 60 * TAU;
  line([[cx - Math.sin(sa) * R * .16, cy + Math.cos(sa) * R * .16], [cx + Math.sin(sa) * R * .74, cy - Math.cos(sa) * R * .74]], R > 200 ? 3 : 1.2, false, C(P.red));
  shape(ell(cx, cy, R * .04, R * .04, 14), P.ink, { lw: 0 });
  // glass glint
  if (!cracked) { ctx.save(); ctx.globalAlpha = .18 * (1 - DR); path(ell(cx - R * .3, cy - R * .35, R * .28, R * .12, 20, -.7), true, true); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore(); }
  if (cracked) {
    const R2 = mulberry(5); const o = [cx + R * .22, cy - R * .3];
    for (let i = 0; i < 7; i++) {
      let a = i / 7 * TAU + R2() * .5, x = o[0], y = o[1]; const pts = [[x, y]];
      for (let k = 0; k < 4; k++) { const st = R * (.12 + R2() * .14); a += (R2() - .5) * .7; x += Math.cos(a) * st; y += Math.sin(a) * st; if (Math.hypot(x - cx, y - cy) > R * .85) break; pts.push([x, y]); }
      if (pts.length > 1) line(pts, R > 200 ? 2 : .9, false, P.ink, .8);
    }
  }
}
function pocketWatch(cx, cy, R, secs, cracked) {
  // chain on table
  const ch = []; for (let i = 0; i <= 26; i++) { const u = i / 26; ch.push([cx + R * .1 - u * R * 2.4 + Math.sin(u * 9) * 18, cy - R * 1.3 + u * R * 2.6 + 30 + Math.cos(u * 7) * 10]); }
  line(ch.filter(p => p[1] > cy + R * .6 || p[0] < cx - R * 1.05), 3, true, C(P.brassSh));
  softEll(cx + 20, cy + R + 4, R * 1.2, 14, '#7a6a55', .45);
  watchFace(cx, cy, R, secs, cracked);
}
function crane(cx, cy, s, col, flap = 0, flip = 1, rot = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s * flip, s);
  const sh = mix(col, '#000000', .18);
  const wy = -38 + flap * 52; // wing tip height (flap 0 = up)
  // far wing
  shape([[-6, -6], [14, -8], [-14 + flap * 6, wy - 6]], sh, { lw: 1.6 });
  // body
  shape([[-30, 0], [0, 10], [30, 0], [0, -10]], col, { lw: 1.6 });
  // neck & tail
  shape([[18, -3], [26, 1], [44, -40], [42, -42]], col, { lw: 1.4 });
  shape([[44, -40], [52, -36], [42, -42]], col, { lw: 1.4 });
  shape([[-18, -3], [-26, 1], [-46, -36], [-44, -38]], col, { lw: 1.4 });
  // near wing
  shape([[-12, -2], [12, -2], [-4 + flap * 8, wy]], mix(col, '#ffffff', .12), { lw: 1.6 });
  ctx.restore();
}
function blossom(x, y, r, col, rot = 0) {
  const pts = [];
  for (let i = 0; i < 5; i++) { const a = rot + i / 5 * TAU; for (let k = -2; k <= 2; k++) { const b = a + k * .22, rr = r * (1 - Math.abs(k) * .12) * (k === 0 ? .92 : 1); pts.push([x + Math.cos(b) * rr, y + Math.sin(b) * rr]); } pts.push([x + Math.cos(a + TAU / 10) * r * .45, y + Math.sin(a + TAU / 10) * r * .45]); }
  shape(pts, col, { lw: 1.8, smooth: true });
  shape(ell(x, y, r * .16, r * .16, 10), '#d9b45a', { lw: 0 });
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + rot; line([[x, y], [x + Math.cos(a) * r * .32, y + Math.sin(a) * r * .32]], 1.1); }
}

// ---------------- the room ----------------
function room(t, mode, view) {
  // mode: 'morning' | 'end' | 'dusk'
  const dusk = mode === 'dusk';
  shape(rect(-400, -300, 2720, 1700), dusk ? '#6f7f88' : P.wall, { lw: 0 });
  mottle(-400, -300, 2720, 1700, .22);
  // light patch from the window
  if (dusk) softEll(1180, 700, 520, 330, '#f0b26a', .35);
  // post
  shape(rect(30, -300, 74, 1120), P.post, { lw: 2.4 });
  for (let i = 0; i < 4; i++) line([[46 + i * 16, -300], [50 + i * 15, 820]], 1, true, P.ink, .35);
  shape(rect(84, -300, 20, 1120), P.postSh, { lw: 0 });
  // window
  const ox = 900, oy = 130, ow = 820, oh = 461.25;
  shape([[ox - 26, oy - 26], [ox + ow + 26, oy - 26], [ox + ow + 26, oy + oh + 18], [ox - 26, oy + oh + 18]], dusk ? '#5e4648' : P.frame, { lw: 2.4 });
  clipTo(rect(ox, oy, ow, oh), () => { ctx.save(); view(); ctx.restore(); });
  ctx.setTransform(...curT);
  shape(rect(ox, oy, ow, oh), null, { lw: 2.6 });
  shape([[ox - 46, oy + oh + 14], [ox + ow + 46, oy + oh + 14], [ox + ow + 40, oy + oh + 34], [ox - 40, oy + oh + 34]], dusk ? '#4e3a3c' : P.frameSh, { lw: 2.2 });
  // table
  shape([[-400, 800], [2320, 800], [2320, 880], [-400, 880]], dusk ? '#c9b28e' : P.table, { lw: 2.4 });
  mottle(-400, 800, 2720, 80, .2);
  shape([[-400, 880], [2320, 880], [2320, 902], [-400, 902]], dusk ? '#a8916f' : P.tableEdge, { lw: 2.2 });
  shape([[-400, 902], [2320, 902], [2320, 1400], [-400, 1400]], P.apron, { lw: 2.2 });
  for (let i = 0; i < 6; i++) line([[-400, 940 + i * 26], [2320, 935 + i * 27]], 1, true, P.ink, .25);
}
let curT = [1, 0, 0, 1, 0, 0];
function camR(cx, cy, s) { cam(cx, cy, s); curT = [CS, 0, 0, CS, W / 2 - cx * CS, H / 2 - cy * CS]; }

// the city seen through the window: map the 1920x1080 city frame into the window opening
function windowView(fn) {
  return () => { const k = 820 / 1920; ctx.transform(k, 0, 0, k, 900, 130); const save = CS; CS = CS * k; fn(); CS = save; };
}

// ---------------- Hiroshima city ----------------
function riverEdges(y) { // main river trapezoid edges at height y
  const u = clamp((y - 610) / (1080 - 610)); return [lerp(830, 260, u), lerp(905, 1120, u)];
}
function river2(y) { const u = clamp((y - 610) / (1080 - 610)); return [lerp(1720, 1880, u), lerp(1770, 2350, u)]; }
const HOUSES = (() => {
  const R = mulberry(42), out = [];
  const rows = 9;
  for (let r = 0; r < rows; r++) {
    const d = r / (rows - 1), y = lerp(632, 1010, Math.pow(d, 1.35)), s = lerp(.22, 1.05, Math.pow(d, 1.2));
    let x = -200 + R() * 80 * s;
    while (x < 2500) {
      const w = (90 + R() * 80) * s, h = (40 + R() * 40) * s;
      const [a, b] = riverEdges(y), [c, e] = river2(y);
      const inRiver = (x + w > a - 20 * s && x < b + 20 * s) || (x + w > c - 20 * s && x < e + 20 * s);
      const tree = R() < .16;
      if (!inRiver) out.push({ x, y, w, h, s, r, tree, roof: R() < .7 ? 0 : 1, wall: R() < .6 ? 0 : 1, two: R() < .18, seed: R() });
      x += w + (6 + R() * 30) * s;
    }
  }
  return out.sort((p, q) => p.y - q.y);
})();
function house(o, ruin) {
  const { x, y, w, h, s } = o;
  if (o.tree) {
    if (ruin) { line([[x + w * .5, y], [x + w * .48, y - h * 1.2], [x + w * .3, y - h * 1.5]], 2.2 * Math.max(.5, s), false, P.char); line([[x + w * .48, y - h * .9], [x + w * .7, y - h * 1.3]], 1.6 * Math.max(.5, s), false, P.char); return; }
    shape(rect(x + w * .45, y - h * .5, w * .1, h * .5), P.post, { lw: 1.2 });
    const p = ell(x + w * .5, y - h * 1.05, w * .55, h * .75, 18);
    shape(p, P.tree, { lw: 1.6, smooth: true }); clipTo(p, () => shape(ell(x + w * .7, y - h * .85, w * .5, h * .7, 16), P.treeSh, { lw: 0 }), true);
    return;
  }
  if (ruin) {
    const R = mulberry(Math.floor(o.seed * 1e6)); const pts = [[x - 6 * s, y]];
    const n = 5 + Math.floor(R() * 4); for (let i = 1; i < n; i++) pts.push([x + w * i / n, y - h * (.15 + R() * .45)]);
    pts.push([x + w + 6 * s, y]);
    shape(pts, R() < .5 ? P.rubble : P.rubbleSh, { lw: 1.4 * Math.max(.6, s) });
    if (R() < .35) line([[x + w * R(), y], [x + w * R() + 10 * s, y - h * (.7 + R() * .6)]], 2.2 * Math.max(.6, s), false, P.char);
